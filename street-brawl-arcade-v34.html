<script>
'use strict';
const VR=Math.random.bind(Math); // native RNG for visuals/audio (never seeded)
const C=document.getElementById('c'),X=C.getContext('2d'),HINT=document.getElementById('hint');
const W=960,H=540,G=450;

// --- Settings & Persistence ---
const DEF_CFG={
 rule:0,        // versus rule mode
 frameAdv:1,    // show +/- frame advantage popups
 diff:1,        // 0 Easy, 1 Normal, 2 Hard
 timer:99,tv:1,      // 30, 60, 99, 0 (Unlimited)
 rounds:2,      // 1, 2, 3
 dmgScale:1,    // 0.75, 1, 1.25
 pracHeal:1,    // 0 Off, 1 On
 pracAi:0,      // 0 Dummy, 1 Block, 2 Retaliate
 inputDisp:1,   // 0 Off, 1 Practice, 2 Always
 master:7,      // 0..10
 music:5,       // 0..10
 sfx:8,         // 0..10
 full:0,        // 0 Off, 1 On
 shake:1,       // 0 Off, 1 On
 vfx:2,         // 2 Full, 1 Reduced, 0 Off
 scale:0,       // 0 Fit, 1 Stretch, 2 Compact
 fdHud:0,       // frame data HUD
 aiSty:0,       // CPU personality
 keys:[
  {l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',L:'KeyJ',H:'KeyK',S:'KeyL',G:'KeyI'},
  {l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',L:'Comma',H:'Period',S:'Slash',G:'Semicolon'}
 ],
 pauseKey:'Escape'
};
const clone=o=>JSON.parse(JSON.stringify(o));
let cfg=clone(DEF_CFG),draftCfg=clone(DEF_CFG),kingpinUnlocked=false,continues=0;
function loadSave(){
 try{
  const raw=localStorage.getItem('sba_cfg_v1');
  if(raw){const p=JSON.parse(raw);if(!p.tv){if(p.timer===60)p.timer=99;p.tv=1}if(p.keys&&p.keys.some(k=>k&&k.B))delete p.keys;cfg={...clone(DEF_CFG),...p,keys:[{...DEF_CFG.keys[0],...(p.keys&&p.keys[0])},{...DEF_CFG.keys[1],...(p.keys&&p.keys[1])}]}}
  kingpinUnlocked=localStorage.getItem('sba_unlock_kingpin')==='1';
  if(!(cfg.aiSty>=0&&cfg.aiSty<AISTY.length))cfg.aiSty=0;if(!(cfg.pracAi>=0&&cfg.pracAi<DUMMY.length))cfg.pracAi=0;if(!(cfg.rule>=0&&cfg.rule<6))cfg.rule=0;
 }catch(_){}
 applyDisplay();
}
function saveCfg(){try{localStorage.setItem('sba_cfg_v1',JSON.stringify(cfg))}catch(_){}}
function unlockKingpin(){kingpinUnlocked=true;try{localStorage.setItem('sba_unlock_kingpin','1')}catch(_){}}
function keyLabel(code){
 if(!code)return '?';
 return code.replace(/^Key/,'').replace(/^Digit/,'').replace('ArrowLeft','LEFT').replace('ArrowRight','RIGHT').replace('ArrowUp','UP').replace('ArrowDown','DOWN').replace('Comma',',').replace('Period','.').replace('Slash','/').replace('Semicolon',';').replace('Escape','ESC').replace('Space','SPACE').replace('Numpad','NUM ');
}
function applyDisplay(){
 C.className=cfg.scale===1?'stretch':cfg.scale===2?'compact':'';
 HINT.innerHTML=`<b>P1:</b> ${keyLabel(cfg.keys[0].l)}/${keyLabel(cfg.keys[0].r)} move, ${keyLabel(cfg.keys[0].u)} jump (again in air = double jump), ${keyLabel(cfg.keys[0].d)} crouch / fast-fall, back to block, <b>${keyLabel(cfg.keys[0].L)}</b> light, <b>${keyLabel(cfg.keys[0].H)}</b> heavy, <b>${keyLabel(cfg.keys[0].S)}</b> special, <b>${keyLabel(cfg.keys[0].G)}</b> grab | <b>P2:</b> ${keyLabel(cfg.keys[1].l)}/${keyLabel(cfg.keys[1].r)} move, ${keyLabel(cfg.keys[1].u)}/${keyLabel(cfg.keys[1].d)}, <b>${keyLabel(cfg.keys[1].L)}/${keyLabel(cfg.keys[1].H)}/${keyLabel(cfg.keys[1].S)}/${keyLabel(cfg.keys[1].G)}</b> (or Numpad 1-4) | <b>${keyLabel(cfg.pauseKey)}</b> Pause | Controllers supported`;
 if(cfg.full&&!document.fullscreenElement&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{})}
 else if(!cfg.full&&document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(()=>{})}
}

// --- Web Audio Synthesizer ---
const aud=(()=>{
 let ctx=null,nextBeat=0,stepIdx=0;
 function init(){
  if(ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC)try{ctx=new AC()}catch(_){}
 }
 function unlock(){init();if(ctx&&ctx.state==='suspended')ctx.resume().catch(()=>{})}
 function tone(freq,dur,type,vol,endFreq,delay=0){
  if(!ctx||cfg.master<=0)return;
  const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(Math.max(30,freq),t);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(25,endFreq),t+dur);
  const v=Math.max(.0001,vol*(cfg.master/10));
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur);
 }
 function noise(dur,vol,hp=200,lp=2400){
  if(!ctx||cfg.master<=0)return;
  const len=Math.max(1,Math.floor(ctx.sampleRate*dur)),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(VR()*2-1)*(1-i/len);
  const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=buf;f.type='bandpass';f.frequency.value=(hp+lp)/2;
  const v=Math.max(.0001,vol*(cfg.master/10));
  g.gain.setValueAtTime(v,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);
  s.connect(f);f.connect(g);g.connect(ctx.destination);s.start();
 }
 function sfx(id){
  if(!ctx||cfg.sfx<=0||cfg.master<=0)return;
  const sv=cfg.sfx/10;
  if(id==='move')tone(520,.045,'triangle',.06*sv,620);
  else if(id==='ok'){tone(520,.07,'square',.08*sv,780);tone(780,.09,'triangle',.07*sv,1040,.05)}
  else if(id==='back')tone(320,.08,'triangle',.07*sv,180);
  else if(id==='whooshL')noise(.07,.09*sv,900,3400);
  else if(id==='whooshH'){noise(.12,.14*sv,380,1800);tone(190,.09,'triangle',.06*sv,90)}
  else if(id==='slash'){noise(.1,.16*sv,1800,5200);tone(920,.08,'sawtooth',.08*sv,340)}
  else if(id==='dash'){noise(.08,.11*sv,700,2800);tone(300,.07,'triangle',.07*sv,560)}
  else if(id==='jump')tone(220,.1,'sine',.07*sv,480);
  else if(id==='land'){noise(.06,.1*sv,120,700);tone(95,.07,'triangle',.09*sv,45)}
  else if(id==='hitL'){noise(.09,.24*sv,600,3200);tone(165,.09,'triangle',.2*sv,58)}
  else if(id==='hitH'){noise(.16,.34*sv,220,2200);tone(140,.18,'sawtooth',.26*sv,38);tone(75,.18,'sine',.22*sv,34)}
  else if(id==='elec'){noise(.12,.22*sv,1600,4800);tone(740,.11,'sawtooth',.14*sv,290);tone(1120,.07,'square',.08*sv,620,.03)}
  else if(id==='fire'){noise(.18,.26*sv,280,1600);tone(240,.16,'sawtooth',.14*sv,85)}
  else if(id==='metal'){tone(620,.12,'square',.15*sv,280);tone(910,.1,'triangle',.12*sv,440);noise(.1,.18*sv,900,3200)}
  else if(id==='slam'){noise(.24,.38*sv,70,850);tone(110,.26,'sawtooth',.28*sv,28);tone(65,.28,'sine',.26*sv,25)}
  else if(id==='boss'){noise(.2,.32*sv,150,1800);tone(220,.22,'sawtooth',.22*sv,55);tone(440,.14,'square',.12*sv,180,.02)}
  else if(id==='thud'){tone(95,.16,'sine',.42*sv,38);tone(180,.05,'square',.12*sv,90);noise(.035,.22*sv,2200,6500)}
  else if(id==='blk'){tone(860,.06,'square',.12*sv,340);noise(.05,.12*sv,1200,4000)}
  else if(id==='break'){noise(.25,.35*sv,1200,5200);tone(460,.2,'sawtooth',.2*sv,110);tone(920,.14,'square',.14*sv,260)}
  else if(id==='grab'){noise(.18,.35*sv,90,900);tone(95,.22,'sawtooth',.26*sv,34)}
  else if(id==='proj'){tone(680,.15,'sawtooth',.12*sv,210)}
  else if(id==='boom'){noise(.32,.38*sv,80,1400);tone(110,.3,'sawtooth',.25*sv,28)}
  else if(id==='ctr'){tone(980,.12,'sine',.22*sv,1320);tone(1320,.22,'triangle',.18*sv,880,.06);tone(660,.25,'sine',.14*sv,660,.04)}
  else if(id==='ko'){noise(.4,.38*sv,90,1500);tone(240,.5,'sawtooth',.28*sv,38);tone(120,.55,'sine',.24*sv,30,.05)}
  else if(id==='start'){tone(440,.09,'square',.1*sv,440);tone(554,.09,'square',.1*sv,554,.07);tone(660,.18,'square',.12*sv,880,.14)}
  else if(id==='clear'){tone(440,.12,'triangle',.11*sv,440);tone(554,.12,'triangle',.11*sv,554,.11);tone(659,.14,'triangle',.12*sv,659,.22);tone(880,.28,'square',.12*sv,880,.34)}
 }
 const VOX={
  rex:{p:125,v:[650,1100],g:.25,w:0,b:.2},     volt:{p:150,v:[550,1500],g:.1,w:0,b:.25},
  brutus:{p:82,v:[600,950],g:.7,w:0,b:.3},     kira:{p:270,v:[800,1500],g:0,w:0,b:.35},
  sensei:{p:105,v:[500,900],g:.3,w:0,b:.5},    ember:{p:200,v:[700,1300],g:.15,w:0,b:.3},
  shade:{p:140,v:[400,1200],g:.1,w:0,b:.7},    titan:{p:78,v:[550,850],g:.55,w:0,b:.2},
  kingpin:{p:92,v:[620,1000],g:.45,w:0,b:.2},  tommy:{p:135,v:[700,1250],g:.2,w:0,b:.25},
  danny:{p:165,v:[650,1400],g:.05,w:0,b:.3},   will:{p:108,v:[580,1000],g:.3,w:0,b:.2},
  donna:{p:235,v:[600,1700],g:.1,w:0,b:.45},   ghost:{p:68,v:[350,800],g:.2,w:.3,b:.9},
  fortyoz:{p:100,v:[700,1050],g:.75,w:.6,b:.25},charcoal:{p:115,v:[680,1150],g:.35,w:.15,b:.2}
 };
 // formant "voice": buzzy source -> 2 vowel filters, pitch contour per grunt type
 function voice(id,kind){
  if(!ctx||cfg.sfx<=0||cfg.master<=0)return;
  const V=VOX[id]||VOX.rex,sv=cfg.sfx/10*(cfg.master/10),t=ctx.currentTime;
  const K={atk:[.11,1.05,.9,.16],hvy:[.2,1.15,.8,.22],hurt:[.17,1.25,.7,.2],ko:[.55,1.1,.5,.24],ult:[.42,1.35,1,.26]}[kind]||[.12,1,1,.15];
  const [dur,up,dn,vol]=K,jit=1+(VR()-.5)*.12,p=V.p*jit*(kind==='hurt'?1.15:1);
  const o=ctx.createOscillator(),o2=ctx.createOscillator();o.type='sawtooth';o2.type='square';
  o.frequency.setValueAtTime(p,t);o.frequency.linearRampToValueAtTime(p*up,t+dur*.25);o.frequency.exponentialRampToValueAtTime(Math.max(30,p*dn),t+dur);
  o2.frequency.setValueAtTime(p*.5,t);o2.frequency.exponentialRampToValueAtTime(Math.max(25,p*dn*.5),t+dur);
  if(V.w){const lf=ctx.createOscillator(),lg=ctx.createGain();lf.frequency.value=6+VR()*3;lg.gain.value=p*.08*V.w;lf.connect(lg);lg.connect(o.frequency);lf.start(t);lf.stop(t+dur)}
  const mix=ctx.createGain(),g2=ctx.createGain();g2.gain.value=V.g*.6;o.connect(mix);o2.connect(g2);g2.connect(mix);
  const out=ctx.createGain();out.gain.setValueAtTime(.0001,t);out.gain.linearRampToValueAtTime(vol*sv*(1-V.b*.5),t+.015);out.gain.exponentialRampToValueAtTime(.0001,t+dur);
  for(const [fq,q,gv] of [[V.v[0]*(kind==='hurt'?.85:1),6,1],[V.v[1],8,.55]]){const bp=ctx.createBiquadFilter(),gg=ctx.createGain();bp.type='bandpass';bp.frequency.value=fq*jit;bp.Q.value=q;gg.gain.value=gv*2.2;mix.connect(bp);bp.connect(gg);gg.connect(out)}
  out.connect(ctx.destination);o.start(t);o2.start(t);o.stop(t+dur+.02);o2.stop(t+dur+.02);
  // breath / rasp
  const n=Math.floor(ctx.sampleRate*dur),bf=ctx.createBuffer(1,n,ctx.sampleRate),d=bf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(VR()*2-1)*(1-i/n);
  const ns=ctx.createBufferSource(),nf=ctx.createBiquadFilter(),ng=ctx.createGain();ns.buffer=bf;nf.type='bandpass';nf.frequency.value=V.v[1]*1.3;nf.Q.value=1.2;
  ng.gain.setValueAtTime(vol*sv*(.15+V.b*.6),t);ng.gain.exponentialRampToValueAtTime(.0001,t+dur);ns.connect(nf);nf.connect(ng);ng.connect(ctx.destination);ns.start(t);
 }
 // per-fighter impact flavour layered on the normal hit sound
 function hitFx(id,heavy){
  if(!ctx||cfg.sfx<=0||cfg.master<=0)return;
  const sv=cfg.sfx/10,h=heavy?1.4:1;
  switch(id){
   case 'volt':noise(.08,.12*sv*h,2000,6000);tone(1400,.05,'square',.05*sv,700);break;
   case 'ember':noise(.14,.14*sv*h,300,1400);break;
   case 'shade':case 'kira':noise(.05,.1*sv*h,3000,7000);tone(1800,.04,'sine',.05*sv,1200);break;
   case 'titan':case 'brutus':case 'kingpin':tone(60,.16,'sine',.25*sv*h,30);break;
   case 'will':tone(700,.1,'square',.08*sv*h,400);tone(1050,.08,'triangle',.06*sv,600);break;
   case 'donna':noise(.04,.16*sv*h,2500,7500);tone(2200,.03,'square',.05*sv,900);break;
   case 'fortyoz':tone(2600,.12,'triangle',.07*sv*h,1900);tone(3400,.09,'sine',.05*sv,2500,.02);noise(.1,.09*sv,4000,9000);break;
   case 'ghost':tone(320,.25,'sine',.08*sv*h,160);noise(.2,.05*sv,600,1800);break;
   case 'charcoal':tone(55,.12,'sine',.22*sv*h,40);tone(110,.06,'square',.06*sv,70);break;
   case 'tommy':case 'danny':case 'rex':tone(200,.05,'square',.06*sv*h,110);break;
   default:noise(.05,.08*sv*h,800,2600);
  }
 }
 let bus=null;
 const mfq=n=>440*Math.pow(2,(n-69)/12);
 function envg(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+a+d)}
 function mo(ty,f,t,d,v,f2){const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);envg(g,t,.005,d,v);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05)}
 function mn(t,d,v,fq,ty){const n=Math.floor(ctx.sampleRate*d),b=ctx.createBuffer(1,n,ctx.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=VR()*2-1;const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;f.type=ty||'bandpass';f.frequency.value=fq;envg(g,t,.002,d,v);s.connect(f);f.connect(g);g.connect(bus);s.start(t)}
 function mkeys(t,ns,d){const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='lowpass';f.frequency.value=900;f.Q.value=2;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.1,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);f.connect(g);g.connect(bus);for(const n of ns)for(const dt of[-9,9]){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=mfq(n);o.detune.value=dt+(VR()-.5)*10;o.connect(f);o.start(t);o.stop(t+d+.05)}}
 function mbus(){
  // Old-school vinyl chain: warm low-pass "record" tone + slow wow/flutter + sparse dusty crackle (no hiss)
  const cp=ctx.createDynamicsCompressor(),lp=ctx.createBiquadFilter(),dl=ctx.createDelay(.05),wow=ctx.createOscillator(),wg=ctx.createGain();
  bus=ctx.createGain();lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=.5;
  dl.delayTime.value=.012;wow.frequency.value=.55;wg.gain.value=.0009;wow.connect(wg);wg.connect(dl.delayTime);wow.start();
  bus.connect(dl);dl.connect(lp);lp.connect(cp);cp.connect(ctx.destination);
  const n=ctx.sampleRate*4,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++){const r=VR();if(r<.00035){const amp=(VR()-.5)*(VR()<.15?.9:.35);for(let k=0;k<40&&i+k<n;k++)d[i+k]+=amp*Math.exp(-k/6)*(k%2?-1:1)}}
  const s=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),cg=ctx.createGain();s.buffer=b;s.loop=true;
  bp.type='bandpass';bp.frequency.value=2600;bp.Q.value=.8;cg.gain.value=.45;
  s.connect(bp);bp.connect(cg);cg.connect(bus);s.start()}
 const KS=[[0,7,10],[0,6,10,13],[0,7,10],[0,3,10,12]];
 const PG=[{r:[36,44,41,43],c:[[63,67,70,74],[60,63,67,68],[63,65,68,72],[62,65,68,71]]},{r:[43,46,44,42],c:[[58,62,65,69],[58,61,65,68],[56,60,63,68],[55,58,62,66]]}];
 const MO=[[[12,72]],[[10,70],[14,67]],[[12,68]],[[8,67],[12,71],[14,74]]];
 function musicTick(state,isBoss,stageIdx=0){
  if(!ctx||ctx.state!=='running'||cfg.music<=0||cfg.master<=0)return;
  if(!bus)mbus();
  bus.gain.value=Math.max(.0001,cfg.music/10*cfg.master/10)*.9;
  const inFight=state==='fight'||state==='intro',SD=60/(isBoss?94:86)/4,pg=PG[isBoss?1:0],now=ctx.currentTime;
  if(nextBeat<now-.5)nextBeat=now+.05;
  while(nextBeat<now+.15){
   const b=(stepIdx>>4)&3,s=stepIdx&15,t=nextBeat+(s&1?SD*.2:0),v=inFight?1:.55;
   if(KS[b].includes(s)){mo('sine',125,t,.32,v,38);if(s===0||s===7||s===10){mo('triangle',mfq(pg.r[b]),t,.45,.6*v);mo('sine',mfq(pg.r[b]),t,.45,.5*v)}}
   if(s===4||s===12){mn(t,.2,.55*v,2200);mo('triangle',185,t,.12,.45*v,120)}
   if(b===3&&s===15)mn(t,.1,.2*v,2200);
   if(inFight&&s%2===0)mn(t,s===14?.14:.045,.1+VR()*.08,8000,'highpass');
   if(s===0)mkeys(t,pg.c[b],SD*7);
   if(s===10&&b%2)mkeys(t,pg.c[b],SD*3);
   for(const[ms,nn]of MO[b])if(ms===s){const q=mfq(nn+(isBoss?-12:0));mo('triangle',q,t,.55,.16);mo('sine',q*2,t,.3,.05)}
   nextBeat+=SD;stepIdx++}
 }
 return {voice,hitFx,unlock,sfx,musicTick};
})();

// --- Move & Character Data ---
const M=(s,a,r,d,w,h,kx,ky,o)=>({s,a,r,d,w,h,kx,ky,k:'p',ya:-4,yb:-4,...o});
const R=Math.round;
const mk=(id,n,full,nick,st,c,c2,a,diff,hp,sp,jp,z,f,q,S,sn,sd,scdMax,rival,quote,bio,style,pers,intros,rivals,wins,ending,H)=>({
 id,n,full,nick,st,c,c2,a,diff,hp,sp,jp,z,sn,sd,scdMax,scd:scdMax,S,rng:S.t==='proj',rival,quote,bio,style,pers,intros,rivals,wins,ending,
 L:M(R(4*f),3,R(7*f),R(5*q),58,13,2,0,{hi:1}),
 H:M(R(9*f),4,R(15*f),R(10*q),76,20,5,-9,{k:'k',lau:1,ya:8,yb:-30,...H}),
 G:M(5,2,24,R(13*q),58,30,6,-6,{t:'grab',k:'b'})
});

const CH=[
 mk('rex','REX','REX "REDLINE" VEGA','REDLINE','Brawler','#e74c3c','#ff4422','#7b241c','Beginner',
  100,3.6,-15,1,1,1,
  M(9,12,20,13,70,24,7,-10,{t:'dash',dx:9.5,lau:1,k:'b'}),
  'Rising Charge','Forward rush into a launching uppercut combo starter.',55,7,
  "I'm not done... not yet.",
  'Champ whose heart stopped when he refused to take a dive. Came back on a pacemaker tuned to redline.',
  'Balanced punches, reliable chains, strong pressure.',
  'Cocky, stubborn, loyal, competitive.',
  ['Let us see if you can hang with a real champ!','No fixed fights here. Just fists and pride.'],

function netTick(){

 while(NET.sent<=NET.frame+NET.delay){
  padU();const i=pk(inp(0));for(const k of'LHSG')delete pr[cfg.keys[0][k]];
  NET.loc[NET.sent]=i;NET.hist[NET.sent]=i;NET.sent++;
 }
 // confirm frames whose real remote input is now known; find the first wrong guess
 let bad=-1;
 while(NET.chk<NET.frame&&NET.rem[NET.chk]!==undefined){
  if(NET.rem[NET.chk]!==NET.pred[NET.chk]){bad=NET.chk;break}
  delete NET.snap[NET.chk-1];delete NET.pred[NET.chk-1];delete NET.loc[NET.chk-1];delete NET.rem[NET.chk-1];NET.chk++;

 if(NET.loc[NET.frame]===undefined)return;

  const buf=new Uint8Array(await new Response(st).arrayBuffer());let b='';for(const x of buf)b+=String.fromCharCode(x);

// Auto-matchmaking: codes are swapped through a free public pub/sub relay (ntfy.sh) using a short room code,

const SIG='https://ntfy.sh/';
const sigTopic=room=>'sba9b-'+room.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function sigPost(room,kind,code){
 const id=mkRoom(),parts=[];for(let i=0;i<code.length;i+=3000)parts.push(code.slice(i,i+3000));
 for(let i=0;i<parts.length;i++){const res=await fetch(SIG+sigTopic(room),{method:'POST',body:kind+'|'+id+'|'+i+'|'+parts.length+'|'+parts[i]});if(!res.ok)throw new Error('relay '+res.status)}
}
function sigListen(room,cb){
 try{NET.es&&NET.es.close()}catch(_){}
 const es=new EventSource(SIG+sigTopic(room)+'/sse?since=10m');NET.es=es;const buf={};
 es.onmessage=e=>{try{const d=JSON.parse(e.data);if(!d.message)return;const [k,id,i,n,...rest]=d.message.split('|');
  const b=buf[id]||(buf[id]={k,n:+n,p:[]});b.p[+i]=rest.join('|');
  if(b.p.filter(x=>x!==undefined).length===b.n){delete buf[id];cb(k+b.p.join(''))}}catch(_){}};
 return es;
}
function sigStop(){try{NET.es&&NET.es.close()}catch(_){}NET.es=null}

async function hostApply(code){

function wrapText(text,x,y,maxW,lh,color,font,align='left',cx=0){

 for(const r of VX.ring){X.globalAlpha=r.l/r.m;X.strokeStyle=r.c;X.lineWidth=r.w*(r.l/r.m)+1;X.beginPath();X.arc(r.x,r.y,r.r,0,7);X.stroke()}

 X.restore();

const TRL={on:0,i:0,done:0,ok:0,best:0};
const IND={on:1,h:[],lf:-1};
function trainTick(){
 if(mode!==3||!P1||IND.lf===fr)return;IND.lf=fr;
 const k=cfg.keys[0],rx=(K[k.r]?1:0)-(K[k.l]?1:0),fw=rx*P1.face,dn=K[k.d]?1:0,up=K[k.u]?1:0;
 const d=up?(fw>0?9:fw<0?7:8):dn?(fw>0?3:fw<0?1:2):(fw>0?6:fw<0?4:5);
 const b=['L','H','S','G'].filter(x=>P1.b&&P1.b[x]===8).join('+');
 const h=IND.h;if(h.length&&h[0].d===d&&!b&&!h[0].b)h[0].n++;else{h.unshift({d,b,n:1});if(h.length>14)h.pop()}
 if(TRL.on){const L=COMBOS[P1.ch.id]||[],t=L[TRL.i%L.length];if(!t)return;
  if(TRL.ok>0){if(--TRL.ok===0){TRL.i=(TRL.i+1)%L.length;TRL.done=0}return}
  const ch=P1.chain||[];let n=0;if(ch[0]!=='#')while(n<ch.length&&n<t.seq.length&&tokOk(t.seq[n],ch[n]))n++;
  if(P1.st!=='atk'&&P1.st!=='idle')n=TRL.done;

  if(P1.mv&&P1.mv.cmbN===t.n&&P1.hit){TRL.ok=100;TRL.done=t.seq.length;aud.sfx('ok');TRL.best=Math.max(TRL.best,TRL.i+1)}
 }
}
function drawTrain(){
 if(mode!==3||!P1)return;

 if(IND.on){X.save();X.fillStyle='#05060cb0';X.fillRect(8,150,86,14*17+8);X.font='bold 13px monospace';X.textAlign='left';
  IND.h.forEach((e,j)=>{const y=166+j*17;X.globalAlpha=1-j*.05;X.fillStyle='#8892b0';X.fillText(String(Math.min(99,e.n)).padStart(2,' '),14,y);X.fillStyle='#fff';X.fillText(AR[e.d],38,y);X.fillStyle='#f5c542';X.fillText(e.b,54,y)});X.restore()}
 if(TRL.on){const L=COMBOS[P1.ch.id]||[],t=L[TRL.i%L.length];if(!t)return;
  X.save();const w=Math.max(380,t.seq.length*62+40),x0=480-w/2;X.fillStyle='#05060cdd';X.fillRect(x0,96,w,78);X.strokeStyle=P1.ch.c2;X.lineWidth=2;X.strokeRect(x0,96,w,78);

  const nm=q=>q.replace(/([LHS])2/,'↓$1').replace(/([LHS])6/,'→$1');

   X.fillStyle='#fff';X.font='bold 16px monospace';X.fillText(nm(q),x,145)});
  X.font='11px system-ui,sans-serif';X.fillStyle='#8892b0';X.fillText('Chain each hit on contact. Hold the direction while pressing.',480,168);
  if(TRL.ok>0){X.font='italic 40px Impact,sans-serif';X.fillStyle='#4ade80';X.strokeStyle='#000';X.lineWidth=6;X.strokeText('SUCCESS!',480,230);X.fillText('SUCCESS!',480,230)}
  X.restore()}
}
