<script>
'use strict';
const VR=Math.random.bind(Math); // native RNG for visuals/audio (never seeded)
const C=document.getElementById('c'),X=C.getContext('2d'),HINT=document.getElementById('hint');
const W=960,H=540,G=450;

// --- Settings & Persistence ---
const DEF_CFG={
 rule:0,        // versus rule mode
 frameAdv:1,    // show +/- frame advantage popups
 diff:1,        // 0 Easy, 1 Normal, 2 Hard
 timer:99,tv:1,      // 30, 60, 99, 0 (Unlimited)
 rounds:2,      // 1, 2, 3
 dmgScale:1,    // 0.75, 1, 1.25
 pracHeal:1,    // 0 Off, 1 On
 pracAi:0,      // 0 Dummy, 1 Block, 2 Retaliate
 inputDisp:1,   // 0 Off, 1 Practice, 2 Always
 master:7,      // 0..10
 music:5,       // 0..10
 sfx:8,         // 0..10
 full:0,        // 0 Off, 1 On
 shake:1,       // 0 Off, 1 On
 vfx:2,         // 2 Full, 1 Reduced, 0 Off
 scale:0,       // 0 Fit, 1 Stretch, 2 Compact
 fdHud:0,       // frame data HUD
 aiSty:0,       // CPU personality
 keys:[
  {l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',L:'KeyJ',H:'KeyK',S:'KeyL',G:'KeyI',SU:'KeyU',UL:'KeyO',RG:'Space',DS:'ShiftLeft'},
  {l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',L:'Comma',H:'Period',S:'Slash',G:'Semicolon',DS:'ShiftRight'}
 ],
 pauseKey:'Escape'
};
const clone=o=>JSON.parse(JSON.stringify(o));
let cfg=clone(DEF_CFG),draftCfg=clone(DEF_CFG),kingpinUnlocked=false,continues=0;
function loadSave(){
 try{
  const raw=localStorage.getItem('sba_cfg_v1');
  if(raw){const p=JSON.parse(raw);if(!p.tv){if(p.timer===60)p.timer=99;p.tv=1}if(p.keys&&p.keys.some(k=>k&&k.B))delete p.keys;cfg={...clone(DEF_CFG),...p,keys:[{...DEF_CFG.keys[0],...(p.keys&&p.keys[0])},{...DEF_CFG.keys[1],...(p.keys&&p.keys[1])}]}}
  kingpinUnlocked=localStorage.getItem('sba_unlock_kingpin')==='1';
  if(!(cfg.aiSty>=0&&cfg.aiSty<AISTY.length))cfg.aiSty=0;if(!(cfg.pracAi>=0&&cfg.pracAi<DUMMY.length))cfg.pracAi=0;if(!(cfg.rule>=0&&cfg.rule<6))cfg.rule=0;
 }catch(_){}
 applyDisplay();
}
function saveCfg(){try{localStorage.setItem('sba_cfg_v1',JSON.stringify(cfg))}catch(_){}}
function unlockKingpin(){kingpinUnlocked=true;try{localStorage.setItem('sba_unlock_kingpin','1')}catch(_){}}
function keyLabel(code){
 if(!code)return '?';
 return code.replace(/^Shift(Left|Right)$/,'SHIFT').replace(/^Key/,'').replace(/^Digit/,'').replace('ArrowLeft','LEFT').replace('ArrowRight','RIGHT').replace('ArrowUp','UP').replace('ArrowDown','DOWN').replace('Comma',',').replace('Period','.').replace('Slash','/').replace('Semicolon',';').replace('Escape','ESC').replace('Space','SPACE').replace('Numpad','NUM ');
}
function applyDisplay(){
 C.className=cfg.scale===1?'stretch':cfg.scale===2?'compact':'';
 HINT.innerHTML=`${keyLabel(cfg.keys[0].l)}/${keyLabel(cfg.keys[0].r)} move, ${keyLabel(cfg.keys[0].u)} jump (again in air = double jump), ${keyLabel(cfg.keys[0].d)} crouch / fast-fall, back to block, <b>${keyLabel(cfg.keys[0].DS)}</b> dash, <b>${keyLabel(cfg.keys[0].L)}</b> light, <b>${keyLabel(cfg.keys[0].H)}</b> heavy, <b>${keyLabel(cfg.keys[0].S)}</b> special, <b>${keyLabel(cfg.keys[0].G)}</b> grab, <b>${keyLabel(cfg.keys[0].SU)}</b> super, <b>${keyLabel(cfg.keys[0].UL)}</b> ultimate, <b>${keyLabel(cfg.keys[0].RG)}</b> rage | <b>${keyLabel(cfg.pauseKey)}</b> Pause | Controllers supported`;
 if(cfg.full&&!document.fullscreenElement&&document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>{})}
 else if(!cfg.full&&document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen().catch(()=>{})}

 function smp(id,v){const a=BUF[id];if(!a||!a.length)return 0;const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=a[Math.floor(VR()*a.length)];s.playbackRate.value=.92+VR()*.16;g.gain.value=v*(cfg.master/10);s.connect(g);g.connect(ctx.destination);s.start();return 1}

async function sigPost(room,kind,code){
 const id=mkRoom(),parts=[];for(let i=0;i<code.length;i+=3000)parts.push(code.slice(i,i+3000));
 for(let i=0;i<parts.length;i++){const res=await fetch(SIG+sigTopic(room),{method:'POST',body:kind+'|'+id+'|'+i+'|'+parts.length+'|'+parts[i]});if(!res.ok)throw new Error('relay '+res.status)}
}
function sigListen(room,cb){
 try{NET.es&&NET.es.close()}catch(_){}
 const es=new EventSource(SIG+sigTopic(room)+'/sse?since=10m');NET.es=es;const buf={};
 es.onmessage=e=>{try{const d=JSON.parse(e.data);if(!d.message)return;const [k,id,i,n,...rest]=d.message.split('|');
  const b=buf[id]||(buf[id]={k,n:+n,p:[]});b.p[+i]=rest.join('|');

}

function wrapText(text,x,y,maxW,lh,color,font,align='left',cx=0){
 X.fillStyle=color;X.font=font;X.textAlign=align;
 const words=text.split(' ');let line='',cy=y;
 for(const w of words){
  const test=line+w+' ';
  if(X.measureText(test).width>maxW&&line){X.fillText(line.trim(),align==='center'?cx:x,cy);line=w+' ';cy+=lh}
  else line=test;
 }
 if(line)X.fillText(line.trim(),align==='center'?cx:x,cy);
}
